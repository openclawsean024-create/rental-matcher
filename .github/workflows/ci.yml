name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 4-job 部署契約（fleet template）：
#   lint  →  test  →  build  →  deploy (GitHub Pages, only on push to main)
# Pages 與 Vercel 二擇一，rental-matcher 採 Pages（純靜態站 + Vite build）
permissions:
  contents: read
  pages: write
  id-token: write

# 取消舊 in-flight run，避免同一 PR 多筆 push 浪費 runner。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPLOY_TARGET: pages

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
      - run: npm run lint
        continue-on-error: false

  test:
    name: Unit / E2E Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
      - run: npm test

  build:
    name: Build (Vite + tsc)
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: vite-dist
          path: web/dist/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci --legacy-peer-deps || npm install
        working-directory: ./web
      - run: npm run build
        working-directory: ./web

      # === Pages 部署（靜態站）===
      - name: Setup Pages
        if: env.DEPLOY_TARGET == 'pages'
        uses: actions/configure-pages@v5
      - name: Upload to Pages
        if: env.DEPLOY_TARGET == 'pages'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/dist
      - name: Deploy to Pages
        if: env.DEPLOY_TARGET == 'pages'
        id: deployment
        uses: actions/deploy-pages@v4
